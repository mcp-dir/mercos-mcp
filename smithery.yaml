# Smithery configuration for Mercos
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_mercos

name: mercos-mcp
displayName: "Mercos"
description: >
  Força de vendas e ERP de representantes na Mercos via API oficial. Liste pedidos, clientes, produtos, tabelas de preço, condições de pagamento, transportadoras, vendedores e comissões, e cadastre ou atualize clientes, produtos, pedidos e estoque por linguagem natural. Autenticação por Company Token, gerado na conta Mercos em Minha Conta, Sistema, Integração.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/mercos-mcp
repository: https://github.com/mcp-dir/mercos-mcp

tags:
  - mercos
  - brazil
  - sales
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_mercos

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_mercos/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
